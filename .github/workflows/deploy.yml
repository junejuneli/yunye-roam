# 推送到 main 后：从 src/ 重新构建 → 跑冒烟测试 → 发布到 GitHub Pages
# 固定访问地址：https://junejuneli.github.io/yunye-roam/
name: 构建并发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建
        run: |
          python3 build.py
          python3 build.py test
      - name: 冒烟测试
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/smoke_test.js
      - name: 整理要发布的文件
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
